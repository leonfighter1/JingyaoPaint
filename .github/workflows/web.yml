# The app moved to https://github.com/leonfighter1/JoyPainting, served at
# https://leonfighter1.github.io/JoyPainting/. This old site now only sends
# visitors (and home-screen icons made before the move) there.
name: Web (moved)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: moved
      - id: deployment
        uses: actions/deploy-pages@v5
