# Builds the iOS app on a GitHub-hosted Mac (free for public repositories),
# since iOS can't be built on Windows.
#
# Every run: analyze and test, build an unsigned release build for devices,
# then start the app on the newest iPhone and iPad simulators and keep their
# screenshots (Actions → this run → Artifacts → ios-screenshots).
#
# Installing on a real iPhone or iPad, or TestFlight, needs an Apple Developer
# account and signing; that's not set up yet.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The newest stable Xcode brings the newest iOS SDK and simulators.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Same Flutter as on the development PC.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter --version && xcodebuild -version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build for devices (release, unsigned)
        run: flutter build ios --release --no-codesign

      - name: Build for the simulator
        run: flutter build ios --simulator --debug

      - name: Start on the iPhone and iPad simulators
        run: bash tool/ios_sim_smoke.sh build/ios/iphonesimulator/Runner.app build/ios_screens

      # Downloadable builds (Actions → this run → Artifacts → ios-builds):
      # an unsigned .ipa for devices (needs signing before it installs) and
      # the simulator app as a zip (a Mac's Simulator, or a browser simulator
      # such as Appetize).
      - name: Package the builds
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          OUT="$PWD/build/ios_out"
          mkdir -p "$OUT/Payload"
          cp -R build/ios/iphoneos/Runner.app "$OUT/Payload/"
          (cd "$OUT" && zip -qry "JoyPainting-v$VERSION-ios-unsigned.ipa" Payload && rm -rf Payload)
          (cd build/ios/iphonesimulator && zip -qry "$OUT/JoyPainting-v$VERSION-ios-simulator.zip" Runner.app)
          ls -l "$OUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ios-builds
          path: build/ios_out/

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-screenshots
          path: build/ios_screens/
          if-no-files-found: ignore
