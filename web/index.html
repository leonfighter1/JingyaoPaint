<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`: "/JingyaoPaint/" on
       GitHub Pages (see .github/workflows/web.yml). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JoyPainting (快乐涂鸦), a drawing app for kids · 给小朋友的画画 App">
  <!-- Full screen, including around the notch; the app does its own
       pinch zoom, so the page itself never zooms. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFF0F5">

  <!-- "Add to Home Screen" on iPhone and iPad: opens full screen like an
       app, with an opaque icon (iOS turns transparent corners black). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JoyPainting">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JoyPainting</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFF0F5; }
    /* Shown while the app downloads; removed when it draws its first frame. */
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #6B2D5C; font-size: 18px;
    }
    #loading img { width: 96px; height: 96px; border-radius: 22px;
      animation: bob 1.2s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-10px); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div id="loading-text">JoyPainting · Loading…</div>
  </div>
  <script>
    // Chinese browsers see the Chinese name, also on the home screen: Safari
    // takes it from apple-mobile-web-app-title when "Add to Home Screen" is
    // tapped. (The app itself follows its own language setting.)
    if ((navigator.language || '').toLowerCase().indexOf('zh') === 0) {
      document.documentElement.lang = 'zh-Hans';
      document.title = '快乐涂鸦';
      document.querySelector('meta[name="apple-mobile-web-app-title"]')
          .setAttribute('content', '快乐涂鸦');
      document.getElementById('loading-text').textContent = '快乐涂鸦 加载中…';
    }
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
